<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IP Address Multi-Lookup</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --accent: #38bdf8;
      --muted: #94a3b8;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1.5rem;
    }

    .container {
      width: 100%;
      max-width: 500px;
      background: var(--card-bg);
      border-radius: 12px;
      padding: 2rem;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      border: 1px solid var(--border);
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 1.5rem;
      color: var(--text);
      text-align: center;
    }

    .search-box {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.25rem;
    }

    input {
      flex: 1;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #0f172a;
      color: var(--text);
      font-size: 1rem;
      outline: none;
    }

    input:focus {
      border-color: var(--accent);
    }

    button {
      padding: 0.75rem 1.25rem;
      background: var(--accent);
      color: #0f172a;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    button:hover {
      opacity: 0.9;
    }

    /* Tab Menu Navigation */
    .tabs-header {
      display: flex;
      gap: 0.25rem;
      border-bottom: 1px solid var(--border);
      margin-bottom: 1.25rem;
    }

    .tab-btn {
      flex: 1;
      padding: 0.6rem 0.5rem;
      background: transparent;
      color: var(--muted);
      border: none;
      border-bottom: 2px solid transparent;
      border-radius: 0;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
    }

    .tab-btn.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
      background: transparent;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: grid;
      gap: 0.75rem;
    }

    .data-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.65rem 0;
      border-bottom: 1px solid var(--border);
    }

    .data-row:last-child {
      border-bottom: none;
    }

    .label {
      color: var(--muted);
      font-size: 0.9rem;
    }

    .value {
      font-weight: 600;
      word-break: break-all;
      text-align: right;
    }

    .external-link-btn {
      display: inline-block;
      margin-top: 0.75rem;
      padding: 0.5rem 0.75rem;
      background: #334155;
      color: var(--accent);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 6px;
      text-align: center;
      transition: background 0.2s;
    }

    .external-link-btn:hover {
      background: #475569;
    }

    .error {
      color: #ef4444;
      text-align: center;
      font-size: 0.9rem;
      margin-top: 1rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>IP Address Lookup</h1>
    
    <div class="search-box">
      <input type="text" id="ipInput" placeholder="Enter IP address (e.g. 8.8.8.8)">
      <button id="searchBtn">Search</button>
    </div>

    <!-- Tab Menu Navigation -->
    <div class="tabs-header">
      <button class="tab-btn active" onclick="switchTab(event, 'tab-ipwhois')">ipwho.is</button>
      <button class="tab-btn" onclick="switchTab(event, 'tab-ipinfo')">ipinfo.io</button>
      <button class="tab-btn" onclick="switchTab(event, 'tab-maxmind')">MaxMind GeoLite</button>
    </div>

    <!-- Tab 1: ipwho.is (Default Active Tab) -->
    <div class="tab-content active" id="tab-ipwhois">
      <div class="data-row"><span class="label">IP Address</span><span class="value" id="api2-ip">-</span></div>
      <div class="data-row"><span class="label">City</span><span class="value" id="api2-city">-</span></div>
      <div class="data-row"><span class="label">Region</span><span class="value" id="api2-region">-</span></div>
      <div class="data-row"><span class="label">Country</span><span class="value" id="api2-country">-</span></div>
      <div class="data-row"><span class="label">ISP / Org</span><span class="value" id="api2-org">-</span></div>
      <div class="data-row"><span class="label">Timezone</span><span class="value" id="api2-timezone">-</span></div>
    </div>

    <!-- Tab 2: ipinfo.io (Replaced ipapi.co) -->
    <div class="tab-content" id="tab-ipinfo">
      <div class="data-row"><span class="label">IP Address</span><span class="value" id="api3-ip">-</span></div>
      <div class="data-row"><span class="label">City</span><span class="value" id="api3-city">-</span></div>
      <div class="data-row"><span class="label">Region</span><span class="value" id="api3-region">-</span></div>
      <div class="data-row"><span class="label">Country</span><span class="value" id="api3-country">-</span></div>
      <div class="data-row"><span class="label">ISP / Org</span><span class="value" id="api3-org">-</span></div>
      <div class="data-row"><span class="label">Timezone</span><span class="value" id="api3-timezone">-</span></div>
    </div>

    <!-- Tab 3: MaxMind GeoLite2 (via Cloudflare Proxy) -->
    <div class="tab-content" id="tab-maxmind">
      <div class="data-row"><span class="label">IP Address</span><span class="value" id="api1-ip">-</span></div>
      <div class="data-row"><span class="label">City</span><span class="value" id="api1-city">-</span></div>
      <div class="data-row"><span class="label">Region</span><span class="value" id="api1-region">-</span></div>
      <div class="data-row"><span class="label">Country</span><span class="value" id="api1-country">-</span></div>
      <div class="data-row"><span class="label">ASN</span><span class="value" id="api1-org">-</span></div>
      <div class="data-row"><span class="label">Timezone</span><span class="value" id="api1-timezone">-</span></div>
      <a id="maxmind-link" href="#" target="_blank" rel="noopener noreferrer" class="external-link-btn" style="display: none;">🔗 Inspect IP on MaxMind.com</a>
    </div>
    
    <div class="error" id="error"></div>
  </div>

  <script>
    function switchTab(event, tabId) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));

      document.getElementById(tabId).classList.add('active');
      event.currentTarget.classList.add('active');
    }

    async function fetchJsonSafe(url) {
      try {
        const res = await fetch(url, {
          headers: { 'Accept': 'application/json' }
        });
        if (!res.ok) return null;
        return await res.json();
      } catch (e) {
        return null;
      }
    }

    async function lookupIP(targetIp = '') {
      const errorEl = document.getElementById('error');
      errorEl.textContent = '';

      const MAXMIND_PROXY_URL = 'https://maxmind-ip-proxy.reese-e40.workers.dev';

      const ep1 = targetIp ? `${MAXMIND_PROXY_URL}?ip=${targetIp}` : MAXMIND_PROXY_URL;
      const ep2 = targetIp ? `https://ipwho.is/${targetIp}` : `https://ipwho.is/`;
      const ep3 = targetIp ? `https://ipinfo.io/${targetIp}/json` : `https://ipinfo.io/json`;

      try {
        const results = await Promise.allSettled([
          fetchJsonSafe(ep1),
          fetchJsonSafe(ep2),
          fetchJsonSafe(ep3)
        ]);

        // --- API 1: MaxMind (via Proxy) ---
        const maxmindRes = results[0].value;
        const maxmindLinkBtn = document.getElementById('maxmind-link');

        if (results[0].status === 'fulfilled' && maxmindRes && !maxmindRes.error) {
          const resolvedIp = maxmindRes.traits?.ip_address || targetIp || 'Current IP';
          
          populateTab('api1', {
            ip: resolvedIp,
            city: maxmindRes.city?.names?.en || '-',
            region: maxmindRes.subdivisions?.[0]?.names?.en || '-',
            country: maxmindRes.country?.names?.en || '-',
            org: maxmindRes.traits?.autonomous_system_number ? `AS${maxmindRes.traits.autonomous_system_number}` : '-',
            timezone: maxmindRes.location?.time_zone || '-'
          });

          if (resolvedIp && resolvedIp !== 'Current IP') {
            maxmindLinkBtn.href = `https://www.maxmind.com/en/geoip2-precision-demo?ip=${resolvedIp}`;
            maxmindLinkBtn.style.display = 'block';
          } else {
            maxmindLinkBtn.style.display = 'none';
          }
        } else {
          setErrorForTab('api1', 'MaxMind Proxy offline');
          maxmindLinkBtn.style.display = 'none';
        }

        // --- API 2: ipwho.is ---
        const ipwhoisRes = results[1].value;
        if (results[1].status === 'fulfilled' && ipwhoisRes && ipwhoisRes.success !== false) {
          populateTab('api2', {
            ip: ipwhoisRes.ip || '-',
            city: ipwhoisRes.city || '-',
            region: ipwhoisRes.region || '-',
            country: ipwhoisRes.country || '-',
            org: ipwhoisRes.connection?.isp || ipwhoisRes.isp || '-',
            timezone: ipwhoisRes.timezone?.id || '-'
          });
        } else {
          setErrorForTab('api2', 'Unable to reach ipwho.is');
        }

        // --- API 3: ipinfo.io ---
        const ipinfoRes = results[2].value;
        if (results[2].status === 'fulfilled' && ipinfoRes && !ipinfoRes.error) {
          populateTab('api3', {
            ip: ipinfoRes.ip || targetIp || '-',
            city: ipinfoRes.city || '-',
            region: ipinfoRes.region || '-',
            country: ipinfoRes.country || '-',
            org: ipinfoRes.org || '-',
            timezone: ipinfoRes.timezone || '-'
          });
        } else {
          setErrorForTab('api3', 'Unable to reach ipinfo.io');
        }

      } catch (err) {
        errorEl.textContent = 'Failed to execute lookups.';
      }
    }

    function populateTab(prefix, data) {
      document.getElementById(`${prefix}-ip`).textContent = data.ip;
      document.getElementById(`${prefix}-city`).textContent = data.city;
      document.getElementById(`${prefix}-region`).textContent = data.region;
      document.getElementById(`${prefix}-country`).textContent = data.country;
      document.getElementById(`${prefix}-org`).textContent = data.org;
      document.getElementById(`${prefix}-timezone`).textContent = data.timezone;
    }

    function setErrorForTab(prefix, message) {
      document.getElementById(`${prefix}-ip`).textContent = message;
      document.getElementById(`${prefix}-city`).textContent = '-';
      document.getElementById(`${prefix}-region`).textContent = '-';
      document.getElementById(`${prefix}-country`).textContent = '-';
      document.getElementById(`${prefix}-org`).textContent = '-';
      document.getElementById(`${prefix}-timezone`).textContent = '-';
    }

    function handleSearch() {
      const input = document.getElementById('ipInput').value.trim();
      lookupIP(input);
    }

    document.getElementById('searchBtn').addEventListener('click', handleSearch);
    document.getElementById('ipInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') handleSearch();
    });

    // Initial search on load
    lookupIP();
  </script>
</body>
</html>
