<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IP Address Lookup</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --accent: #38bdf8;
      --muted: #94a3b8;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1.5rem;
    }

    .container {
      width: 100%;
      max-width: 500px;
      background: var(--card-bg);
      border-radius: 12px;
      padding: 2rem;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      border: 1px solid var(--border);
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 1.5rem;
      color: var(--text);
      text-align: center;
    }

    .search-box {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }

    input {
      flex: 1;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #0f172a;
      color: var(--text);
      font-size: 1rem;
      outline: none;
    }

    input:focus {
      border-color: var(--accent);
    }

    button {
      padding: 0.75rem 1.25rem;
      background: var(--accent);
      color: #0f172a;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    button:hover {
      opacity: 0.9;
    }

    .results {
      display: grid;
      gap: 0.75rem;
    }

    .data-row {
      display: flex;
      justify-content: space-between;
      padding: 0.75rem 0;
      border-bottom: 1px solid var(--border);
    }

    .data-row:last-child {
      border-bottom: none;
    }

    .label {
      color: var(--muted);
      font-size: 0.9rem;
    }

    .value {
      font-weight: 600;
      word-break: break-all;
    }

    .error {
      color: #ef4444;
      text-align: center;
      font-size: 0.9rem;
      margin-top: 0.5rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>IP Address Lookup</h1>
    
    <div class="search-box">
      <input type="text" id="ipInput" placeholder="Enter IP address (e.g. 8.8.8.8)">
      <button onclick="lookupIP()">Search</button>
    </div>

    <div class="results" id="results">
      <div class="data-row"><span class="label">IP Address</span><span class="value" id="res-ip">-</span></div>
      <div class="data-row"><span class="label">City</span><span class="value" id="res-city">-</span></div>
      <div class="data-row"><span class="label">Region / State</span><span class="value" id="res-region">-</span></div>
      <div class="data-row"><span class="label">Country</span><span class="value" id="res-country">-</span></div>
      <div class="data-row"><span class="label">ISP / Org</span><span class="value" id="res-org">-</span></div>
      <div class="data-row"><span class="label">Timezone</span><span class="value" id="res-timezone">-</span></div>
    </div>
    
    <div class="error" id="error"></div>
  </div>

  <script>
    async function lookupIP(targetIp = '') {
      const errorEl = document.getElementById('error');
      errorEl.textContent = '';
      
      const endpoint = targetIp 
        ? `https://ipapi.co/${targetIp}/json/` 
        : `https://ipapi.co/json/`;

      try {
        const response = await fetch(endpoint);
        const data = await response.json();

        if (data.error) {
          throw new Error(data.reason || 'Invalid IP address or request limit reached.');
        }

        document.getElementById('res-ip').textContent = data.ip || '-';
        document.getElementById('res-city').textContent = data.city || '-';
        document.getElementById('res-region').textContent = data.region || '-';
        document.getElementById('res-country').textContent = `${data.country_name || '-'} (${data.country_code || '-'})`;
        document.getElementById('res-org').textContent = data.org || '-';
        document.getElementById('res-timezone').textContent = data.timezone || '-';
      } catch (err) {
        errorEl.textContent = err.message || 'Failed to fetch IP details.';
      }
    }

    // Manual search trigger
    function handleSearch() {
      const input = document.getElementById('ipInput').value.trim();
      lookupIP(input);
    }

    // Trigger on button click
    document.querySelector('button').addEventListener('click', handleSearch);

    // Trigger on Enter key in input
    document.getElementById('ipInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') handleSearch();
    });

    // Automatically lookup the visitor's IP on initial load
    lookupIP();
  </script>
</body>
</html>
