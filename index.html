<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IP Address Multi-Lookup</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --accent: #38bdf8;
      --muted: #94a3b8;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1.5rem;
    }

    .container {
      width: 100%;
      max-width: 500px;
      background: var(--card-bg);
      border-radius: 12px;
      padding: 2rem;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      border: 1px solid var(--border);
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 1.5rem;
      color: var(--text);
      text-align: center;
    }

    .search-box {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.25rem;
    }

    input {
      flex: 1;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #0f172a;
      color: var(--text);
      font-size: 1rem;
      outline: none;
    }

    input:focus {
      border-color: var(--accent);
    }

    button {
      padding: 0.75rem 1.25rem;
      background: var(--accent);
      color: #0f172a;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    button:hover {
      opacity: 0.9;
    }

    /* Tab Menu Navigation */
    .tabs-header {
      display: flex;
      gap: 0.25rem;
      border-bottom: 1px solid var(--border);
      margin-bottom: 1.25rem;
    }

    .tab-btn {
      flex: 1;
      padding: 0.6rem 0.5rem;
      background: transparent;
      color: var(--muted);
      border: none;
      border-bottom: 2px solid transparent;
      border-radius: 0;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
    }

    .tab-btn.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
      background: transparent;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: grid;
      gap: 0.75rem;
    }

    .data-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.65rem 0;
      border-bottom: 1px solid var(--border);
    }

    .data-row:last-child {
      border-bottom: none;
    }

    .label {
      color: var(--muted);
      font-size: 0.9rem;
    }

    .value {
      font-weight: 600;
      word-break: break-all;
      text-align: right;
    }

    .error {
      color: #ef4444;
      text-align: center;
      font-size: 0.9rem;
      margin-top: 1rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>IP Address Lookup</h1>
    
    <div class="search-box">
      <input type="text" id="ipInput" placeholder="Enter IP address (e.g. 8.8.8.8)">
      <button id="searchBtn">Search</button>
    </div>

    <!-- Tab Menu Navigation -->
    <div class="tabs-header">
      <button class="tab-btn active" onclick="switchTab(event, 'tab-ipwhois')">ipwho.is</button>
      <button class="tab-btn" onclick="switchTab(event, 'tab-ipinfo')">ipinfo.io</button>
      <button class="tab-btn" onclick="switchTab(event, 'tab-country')">country.is</button>
    </div>

    <!-- Tab 1: ipwho.is -->
    <div class="tab-content active" id="tab-ipwhois">
      <div class="data-row"><span class="label">IP Address</span><span class="value" id="api1-ip">-</span></div>
      <div class="data-row"><span class="label">City</span><span class="value" id="api1-city">-</span></div>
      <div class="data-row"><span class="label">Region</span><span class="value" id="api1-region">-</span></div>
      <div class="data-row"><span class="label">Country</span><span class="value" id="api1-country">-</span></div>
      <div class="data-row"><span class="label">ISP / Org</span><span class="value" id="api1-org">-</span></div>
      <div class="data-row"><span class="label">Timezone</span><span class="value" id="api1-timezone">-</span></div>
    </div>

    <!-- Tab 2: ipinfo.io -->
    <div class="tab-content" id="tab-ipinfo">
      <div class="data-row"><span class="label">IP Address</span><span class="value" id="api2-ip">-</span></div>
      <div class="data-row"><span class="label">City</span><span class="value" id="api2-city">-</span></div>
      <div class="data-row"><span class="label">Region</span><span class="value" id="api2-region">-</span></div>
      <div class="data-row"><span class="label">Country</span><span class="value" id="api2-country">-</span></div>
      <div class="data-row"><span class="label">ISP / Org</span><span class="value" id="api2-org">-</span></div>
      <div class="data-row"><span class="label">Timezone</span><span class="value" id="api2-timezone">-</span></div>
    </div>

    <!-- Tab 3: country.is -->
    <div class="tab-content" id="tab-country">
      <div class="data-row"><span class="label">IP Address</span><span class="value" id="api3-ip">-</span></div>
      <div class="data-row"><span class="label">City</span><span class="value" id="api3-city">-</span></div>
      <div class="data-row"><span class="label">Region</span><span class="value" id="api3-region">-</span></div>
      <div class="data-row"><span class="label">Country Code</span><span class="value" id="api3-country">-</span></div>
      <div class="data-row"><span class="label">ASN</span><span class="value" id="api3-org">-</span></div>
      <div class="data-row"><span class="label">Timezone</span><span class="value" id="api3-timezone">-</span></div>
    </div>
    
    <div class="error" id="error"></div>
  </div>

  <script>
    function switchTab(event, tabId) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));

      document.getElementById(tabId).classList.add('active');
      event.currentTarget.classList.add('active');
    }

    async function lookupIP(targetIp = '') {
      const errorEl = document.getElementById('error');
      errorEl.textContent = '';

      // Set up 3 reliable endpoints
      const ep1 = targetIp ? `https://ipwho.is/${targetIp}` : `https://ipwho.is/`;
      const ep2 = targetIp ? `https://ipinfo.io/${targetIp}/json` : `https://ipinfo.io/json`;
      const ep3 = targetIp ? `https://api.country.is/${targetIp}?fields=city,subdivision,asn,location` : `https://api.country.is/?fields=city,subdivision,asn,location`;

      try {
        const results = await Promise.allSettled([
          fetch(ep1).then(r => r.json()),
          fetch(ep2).then(r => r.json()),
          fetch(ep3).then(r => r.json())
        ]);

        // API 1: ipwho.is
        if (results[0].status === 'fulfilled' && results[0].value.success !== false) {
          const res = results[0].value;
          populateTab('api1', {
            ip: res.ip || '-',
            city: res.city || '-',
            region: res.region || '-',
            country: res.country || '-',
            org: res.connection?.isp || res.isp || '-',
            timezone: res.timezone?.id || '-'
          });
        } else {
          setErrorForTab('api1', 'Unable to reach ipwho.is');
        }

        // API 2: ipinfo.io
        if (results[1].status === 'fulfilled' && !results[1].value.error) {
          const res = results[1].value;
          populateTab('api2', {
            ip: res.ip || '-',
            city: res.city || '-',
            region: res.region || '-',
            country: res.country || '-',
            org: res.org || '-',
            timezone: res.timezone || '-'
          });
        } else {
          setErrorForTab('api2', 'Unable to reach ipinfo.io');
        }

        // API 3: country.is
        if (results[2].status === 'fulfilled' && !results[2].value.error) {
          const res = results[2].value;
          populateTab('api3', {
            ip: res.ip || '-',
            city: res.city || '-',
            region: res.subdivision || '-',
            country: res.country || '-',
            org: res.asn ? `AS${res.asn.number}` : '-',
            timezone: res.location?.time_zone || '-'
          });
        } else {
          setErrorForTab('api3', 'Unable to reach country.is');
        }

      } catch (err) {
        errorEl.textContent = 'Failed to execute lookups.';
      }
    }

    function populateTab(prefix, data) {
      document.getElementById(`${prefix}-ip`).textContent = data.ip;
      document.getElementById(`${prefix}-city`).textContent = data.city;
      document.getElementById(`${prefix}-region`).textContent = data.region;
      document.getElementById(`${prefix}-country`).textContent = data.country;
      document.getElementById(`${prefix}-org`).textContent = data.org;
      document.getElementById(`${prefix}-timezone`).textContent = data.timezone;
    }

    function setErrorForTab(prefix, message) {
      document.getElementById(`${prefix}-ip`).textContent = message;
      document.getElementById(`${prefix}-city`).textContent = '-';
      document.getElementById(`${prefix}-region`).textContent = '-';
      document.getElementById(`${prefix}-country`).textContent = '-';
      document.getElementById(`${prefix}-org`).textContent = '-';
      document.getElementById(`${prefix}-timezone`).textContent = '-';
    }

    function handleSearch() {
      const input = document.getElementById('ipInput').value.trim();
      lookupIP(input);
    }

    document.getElementById('searchBtn').addEventListener('click', handleSearch);
    document.getElementById('ipInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') handleSearch();
    });

    // Initial search on load
    lookupIP();
  </script>
</body>
</html>
